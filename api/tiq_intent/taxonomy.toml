# Taxonomy intent — livello A (keyword deterministiche).
#
# Fonte unica condivisa da DUE consumatori:
#   - il crate Rust `tiq_intent` (scorer in-process via PyO3)
#   - l'oracolo Python di riferimento (test + fallback)
#
# REGOLE DI SCOPE (non violarle senza cablare respond.py):
#   - I 23 `topic` qui sono ESATTAMENTE treasureiq.chat.intent.Topic (meno
#     "sconosciuto", che e' l'esito di default, non una categoria con keyword).
#     Nessun topic nuovo: aggiungerne uno significa aggiungere rami a valle.
#     Qui si allarga solo la RECALL (piu' frasi -> stesso topic).
#   - Le keyword STORICHE di TOPIC_KEYWORDS sono conservate verbatim; le righe
#     in piu' sono le estensioni (parafrasi, plurali, forme colloquiali) che
#     chiudono i buchi trovati nell'analisi copertura.
#   - Un trattino finale ("maternit-", "disabilit-") e' uno STEM: match del
#     prefisso, come rstrip("-") in _topic_keyword_presente.
#
# COLLISIONI VOLUTE (le risolve il peso per specificita', non un topic sbagliato):
#   "tassa rifiuti" -> tributi (2 token) batte "rifiuti" -> rifiuti (1 token).
#   "assistenza domiciliare" e' condivisa disabilita/caregiver come nell'originale.
#
# SCORING (contratto per il crate e per l'oracolo):
#   msg -> casefold. Per ogni keyword presente come sottostringa (o stem se
#   termina con "-"), peso = numero di token della keyword (la frase piu'
#   lunga e specifica vince). score(topic) = max peso fra le sue keyword
#   presenti. topic scelto = argmax score. Pareggio fra topic diversi allo
#   stesso peso massimo, o score 0 -> "sconosciuto".
#   confidence = score_top / (score_top + score_secondo)  (1.0 se unico hit).
#   Sotto soglia di confidence il chiamante ripiega a "sconosciuto"
#   (fallimento sicuro: la chat chiede la categoria, non indovina).

schema_version = 1

# Topic informativi per natura: `kind` sempre "informazione" (nessun verdetto
# di idoneita' da dare). Allineato a INFORMATIONAL_BY_NATURE_TOPICS.
informational_by_nature = ["rifiuti", "volontariato"]

# --- kind: agevolazione vs informazione -------------------------------------
# DIRITTO/beneficio -> agevolazione; FATTO civico (quando/dove/come/orario/
# ufficio) -> informazione. In pareggio o assenza vince "informazione".
[kind]
agevolazione_markers = [
  "ho diritto", "ne ho diritto", "posso avere", "posso ottenere", "mi spetta",
  "spetta", "spettano", "ho bisogno di aiuto", "non riesco a pagare",
  "non ce la faccio a pagare", "difficolta a pagare", "sono in difficolta",
  "contributo", "contributi", "agevolazione", "agevolazioni", "bonus",
  "sussidio", "sussidi", "incentivo", "incentivi", "sostegno economico",
  "aiuto economico", "esenzione", "sconto", "riduzione", "rimborso",
  "agevolat-",
]
informazione_markers = [
  "quando", "a che ora", "che ora", "orario", "orari", "apre", "apertura",
  "chiude", "chiuso", "chiusura", "aperto", "dove si trova", "dov'e",
  "come faccio", "come posso", "come si fa", "come devo", "a chi mi rivolgo",
  "a chi devo", "chi e il responsabile", "responsabile", "email", "pec",
  "telefono", "numero di telefono", "recapito", "recapiti", "indirizzo",
  "calendario", "scadenza", "modulo", "modulistica", "documenti servono",
  "cosa serve", "prenotare", "prenotazione", "appuntamento",
]

