# TreasureIQ — clone and run.
#
#     docker compose up --build
#     open http://localhost:3000
#
# No API key and no network access to the comune are needed: the snapshots in
# data/seed/ and the extraction cache in data/extraction-cache/ are committed,
# which is what makes the demo reproducible for anyone reviewing it.

services:
  api:
    build:
      context: ./api
      # Esplicito, e non per pedanteria: senza questo compose costruisce
      # l'ULTIMO stage del Dockerfile, che è `dev` (quello dei test). L'API
      # partiva eseguendo pytest e si riavviava all'infinito. Lo stage che
      # serve i cittadini è `base`, e lo si dice qui.
      target: base
    # 8010 rather than 8000: on machines running OrbStack or Docker Desktop the
    # 8000 port is frequently already bound, and requests to localhost:8000 then
    # reach the wrong process and 404 in a way that looks like an app bug.
    ports:
      - "8010:8000"
    environment:
      TREASUREIQ_DATA_DIR: /data
      TREASUREIQ_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # Signs the demo session cookie. Override in any real deployment — the
      # default is public in this repository and therefore not a secret.
      TREASUREIQ_SECRET: ${TREASUREIQ_SECRET:-treasureiq-demo-not-secret}
      # Which LLM backend serves extraction/chat. Default is the local,
      # offline-friendly Ollama daemon; set to "anthropic" to use the API
      # fallback instead.
      TREASUREIQ_LLM_PROVIDER: ${TREASUREIQ_LLM_PROVIDER:-ollama}
      # host.docker.internal lets the container reach an Ollama daemon
      # running on the host, since Ollama itself is not containerised here.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Optional: only needed when TREASUREIQ_LLM_PROVIDER=anthropic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      # Required for host.docker.internal to resolve on Linux hosts; a no-op
      # on Docker Desktop/OrbStack, where it already resolves.
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: the API serves these snapshots and must never rewrite them.
      # Refreshing them is the ingestion CLI's job, run deliberately.
      - ./data:/data:ro
      # D-33 — due cicli di vita, due mount. Sopra: i seed curati, immutabili
      # a runtime e versionati in git. Qui: quello che l'API legge dai portali
      # mentre un cittadino aspetta (D-32), scrivibile e fuori da git. La
      # separazione la impone il filesystem, non la disciplina di chi scrive:
      # un risultato non verificato archiviato fra i dati curati ne
      # erediterebbe l'autorità senza averla mai guadagnata.
      - ./data-live:/live
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # The browser resolves this, not the compose network, so it points at
        # the host-published port rather than at http://api:8000.
        NEXT_PUBLIC_TREASUREIQ_API: http://localhost:8010
    ports:
      - "3000:3000"
    environment:
      # Server-side rendering runs inside this container, where "localhost" is
      # the web service itself. Server components must reach the API over the
      # compose network; the browser still uses the published host port baked
      # into the client bundle at build time.
      TREASUREIQ_API_INTERNAL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Ingestion-time only (D-28/R-15): the web-search fallback that backs the
  # `M6_web_aperto` readiness rung. Behind `profiles: ["ingest"]` so a plain
  # `docker compose up` never starts it — no network call at runtime is a
  # property of this file, not a convention someone can forget to follow.
  # Run it deliberately with:
  #   docker compose --profile ingest up -d searxng
  #   python -m treasureiq.ingest.websearch "<query>" --write
  searxng:
    image: searxng/searxng:latest
    profiles: ["ingest"]
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    restart: "no"
