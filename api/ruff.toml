# Lint policy for the TreasureIQ API.
#
# Deliberately narrow: ruff's defaults (pycodestyle errors + pyflakes) plus
# import ordering. Enough to catch dead imports, real syntax problems and
# import drift, without imposing style opinions on code that already shipped.
#
# Two rule families are left OFF on purpose, not by omission:
#
#   BLE001 (`except Exception`) — this is the shape of the project's
#   degradation contract. D-01 requires the chat endpoint to answer from
#   deterministic engine text when the model is unreachable; D-28 requires a
#   failed web search to write nothing rather than a stand-in result. Both are
#   broad catches around a boundary we do not control (Ollama, SearXNG, a cache
#   file on disk). Narrowing them would let an unanticipated error escape and
#   either 500 the endpoint or leave a half-written cache entry that later
#   reads as a genuine search result.
#
#   B008 (function call in argument default) — `Depends(...)` in a signature
#   default is the documented FastAPI idiom, not a bug.

line-length = 100

[lint]
# `select`, not `extend-select`: ruff 0.16's own defaults are broader than the
# classic pycodestyle+pyflakes set and flag style opinions across code that
# already shipped. Pin the set explicitly so a lint failure in a VERIFY always
# means a real defect in the brief being gated.
select = ["E4", "E7", "E9", "F", "I"]
